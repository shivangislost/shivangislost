<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08091a"/>
      <stop offset="0.5" stop-color="#11132b"/>
      <stop offset="1" stop-color="#080b18"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151832"/>
      <stop offset="1" stop-color="#0c1024"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00eaff"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#d85cff"/>
    </linearGradient>

    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00eaff"/>
      <stop offset="1" stop-color="#4b8dff"/>
    </linearGradient>

    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#d85cff"/>
    </linearGradient>

    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#27305a" stroke-width="1" opacity=".42"/>
    </pattern>

    <clipPath id="clip">
      <rect x="0" y="0" width="800" height="520" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="800" height="520" fill="url(#bg)"/>
    <rect width="800" height="520" fill="url(#grid)" opacity=".7"/>

    <!-- ambient neon accents -->
    <circle cx="720" cy="70" r="120" fill="#7c5cff" opacity=".07"/>
    <circle cx="100" cy="470" r="150" fill="#00eaff" opacity=".045"/>

    <!-- outer frame -->
    <rect x="10" y="10" width="780" height="500" rx="22" fill="none" stroke="#313a68" stroke-width="2"/>
    <rect x="16" y="16" width="768" height="488" rx="18" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" opacity=".65"/>

    <!-- header -->
    <rect x="28" y="28" width="744" height="62" rx="13" fill="#0b0e20" stroke="#29325b"/>
    <circle cx="50" cy="59" r="7" fill="#00eaff" filter="url(#glowCyan)"/>
    <text x="68" y="56" fill="#f2f5ff" font-family="monospace" font-size="22" font-weight="700" letter-spacing="2">SHIVANG.EXE</text>
    <text x="68" y="75" fill="#7180b7" font-family="monospace" font-size="10" letter-spacing="1.5">DATA • BUSINESS • INTELLIGENCE</text>

    <rect x="604" y="45" width="142" height="28" rx="14" fill="#0c1e25" stroke="#00eaff" opacity=".95"/>
    <circle cx="620" cy="59" r="4" fill="#2dff9a" filter="url(#glowCyan)"/>
    <text x="631" y="63" fill="#6fffe4" font-family="monospace" font-size="11" font-weight="700">SYSTEM ONLINE</text>

    <!-- left panel -->
    <rect x="28" y="104" width="330" height="300" rx="15" fill="url(#panel)" stroke="#2b3564"/>
    <text x="50" y="135" fill="#00eaff" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2">01 / SKILL MATRIX</text>
    <text x="50" y="164" fill="#f3f5ff" font-family="sans-serif" font-size="20" font-weight="700">Core Stack</text>

    <text x="50" y="197" fill="#aeb8e6" font-family="monospace" font-size="12">PYTHON</text>
    <rect x="130" y="187" width="190" height="9" rx="4.5" fill="#202744"/>
    <rect x="130" y="187" width="170" height="9" rx="4.5" fill="url(#bar1)" filter="url(#glowCyan)"/>

    <text x="50" y="231" fill="#aeb8e6" font-family="monospace" font-size="12">SQL</text>
    <rect x="130" y="221" width="190" height="9" rx="4.5" fill="#202744"/>
    <rect x="130" y="221" width="158" height="9" rx="4.5" fill="url(#bar2)" filter="url(#glowPurple)"/>

    <text x="50" y="265" fill="#aeb8e6" font-family="monospace" font-size="12">POWER BI</text>
    <rect x="130" y="255" width="190" height="9" rx="4.5" fill="#202744"/>
    <rect x="130" y="255" width="176" height="9" rx="4.5" fill="url(#bar1)" filter="url(#glowCyan)"/>

    <text x="50" y="299" fill="#aeb8e6" font-family="monospace" font-size="12">TABLEAU</text>
    <rect x="130" y="289" width="190" height="9" rx="4.5" fill="#202744"/>
    <rect x="130" y="289" width="145" height="9" rx="4.5" fill="url(#bar2)" filter="url(#glowPurple)"/>

    <text x="50" y="333" fill="#aeb8e6" font-family="monospace" font-size="12">REACT</text>
    <rect x="130" y="323" width="190" height="9" rx="4.5" fill="#202744"/>
    <rect x="130" y="323" width="128" height="9" rx="4.5" fill="url(#bar1)" filter="url(#glowCyan)"/>

    <line x1="50" y1="360" x2="326" y2="360" stroke="#29325b"/>
    <text x="50" y="382" fill="#7180b7" font-family="monospace" font-size="10">FOCUS</text>
    <text x="105" y="382" fill="#dbe2ff" font-family="monospace" font-size="10">BI • ETL • VISUALIZATION</text>

    <!-- right panel -->
    <rect x="374" y="104" width="398" height="300" rx="15" fill="url(#panel)" stroke="#2b3564"/>
    <text x="396" y="135" fill="#d85cff" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2">02 / LIVE ANALYTICS</text>
    <text x="396" y="164" fill="#f3f5ff" font-family="sans-serif" font-size="20" font-weight="700">Decision Pipeline</text>

    <!-- graph -->
    <rect x="396" y="180" width="354" height="116" rx="10" fill="#090d1e" stroke="#202b52"/>
    <path d="M410 270H738M410 240H738M410 210H738" stroke="#202b52" stroke-width="1"/>
    <path d="M410 276 L450 260 L486 266 L522 232 L555 244 L592 214 L627 225 L665 195 L700 210 L736 184"
          fill="none" stroke="#00eaff" stroke-width="3" filter="url(#glowCyan)"/>
    <path d="M410 276 L450 260 L486 266 L522 232 L555 244 L592 214 L627 225 L665 195 L700 210 L736 184 L736 276 Z"
          fill="#00eaff" opacity=".06"/>
    <circle cx="736" cy="184" r="5" fill="#00eaff" filter="url(#glowCyan)"/>
    <text x="410" y="193" fill="#52608f" font-family="monospace" font-size="9">SIGNAL / TREND</text>
    <text x="677" y="287" fill="#53618e" font-family="monospace" font-size="9">TIME →</text>

    <!-- mini metric cards -->
    <rect x="396" y="311" width="108" height="70" rx="10" fill="#0b1024" stroke="#29325b"/>
    <text x="410" y="333" fill="#7180b7" font-family="monospace" font-size="9">PROJECTS</text>
    <text x="410" y="359" fill="#00eaff" font-family="monospace" font-size="23" font-weight="700">20+</text>
    <text x="410" y="373" fill="#53618e" font-family="monospace" font-size="8">BUILD • SHIP • LEARN</text>

    <rect x="516" y="311" width="108" height="70" rx="10" fill="#0b1024" stroke="#29325b"/>
    <text x="530" y="333" fill="#7180b7" font-family="monospace" font-size="9">DASHBOARDS</text>
    <text x="530" y="359" fill="#d85cff" font-family="monospace" font-size="23" font-weight="700">15+</text>
    <text x="530" y="373" fill="#53618e" font-family="monospace" font-size="8">DATA → INSIGHT</text>

    <rect x="636" y="311" width="114" height="70" rx="10" fill="#0b1024" stroke="#29325b"/>
    <text x="650" y="333" fill="#7180b7" font-family="monospace" font-size="9">STATUS</text>
    <circle cx="653" cy="356" r="5" fill="#2dff9a" filter="url(#glowCyan)"/>
    <text x="665" y="361" fill="#6fffe4" font-family="monospace" font-size="13" font-weight="700">BUILDING</text>
    <text x="650" y="374" fill="#53618e" font-family="monospace" font-size="8">NEXT LEVEL</text>

    <!-- footer terminal -->
    <rect x="28" y="420" width="744" height="72" rx="14" fill="#070b17" stroke="#2b3564"/>
    <circle cx="50" cy="443" r="4" fill="#ff5f57"/>
    <circle cx="64" cy="443" r="4" fill="#ffbd2e"/>
    <circle cx="78" cy="443" r="4" fill="#28c840"/>
    <text x="98" y="447" fill="#7180b7" font-family="monospace" font-size="10">TERMINAL / SHIVANG</text>

    <text x="50" y="471" fill="#00eaff" font-family="monospace" font-size="11">&gt;</text>
    <text x="64" y="471" fill="#b9c3ec" font-family="monospace" font-size="11">transforming raw data into business decisions</text>
    <rect x="384" y="462" width="7" height="13" fill="#00eaff" opacity=".9"/>
    <text x="412" y="471" fill="#53618e" font-family="monospace" font-size="10">PYTHON • SQL • BI • WEB</text>

    <text x="704" y="471" fill="#7c5cff" font-family="monospace" font-size="10" text-anchor="end">v2.0</text>
  </g>
</svg>
